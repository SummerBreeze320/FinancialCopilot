server:
  port: 8080

spring:
  application:
    name: financial-copilot
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:financial_copilot}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:50}
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/memory-schema.sql,classpath:db/billing-schema.sql,classpath:db/conversation-schema.sql,classpath:db/execution-schema.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:123456}
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.financial.copilot.data.*.po
  type-handlers-package: com.financial.copilot.data.config
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 金融智能投研核心配置 (copilot)
copilot:
  neo4j:
    enabled: ${NEO4J_ENABLED:true}
  redis:
    enabled: ${REDIS_ENABLED:true}
  conversation:
    persistence-enabled: ${CONVERSATION_PERSISTENCE_ENABLED:true}
  alipay:
    enabled: ${ALIPAY_ENABLED:false}
    sandbox: ${ALIPAY_SANDBOX:true}
    app-id: ${ALIPAY_APP_ID:}
    seller-id: ${ALIPAY_SELLER_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    public-key: ${ALIPAY_PUBLIC_KEY:}
    notify-url: ${ALIPAY_NOTIFY_URL:}
  jwt:
    secret: ${JWT_SECRET:FinancialCopilotSecretKeyForJwtAuthentication2026SecureKeyWithAtLeast256BitsLong!}
    access-token-expiration-ms: 7200000
    refresh-token-expiration-ms: 604800000
  llm:
    default-provider: DEEPSEEK
    default-model: ${LLM_MODEL:deepseek-chat}
    default-performance-level: MIDDLE
    api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  rag:
    embedding:
      base-url: ${EMBEDDING_BASE_URL:http://127.0.0.1:11434}
      model: ${EMBEDDING_MODEL:qwen3-embedding:0.6b}
      batch-size: ${EMBEDDING_BATCH_SIZE:32}
  memory-service:
    url: ${MEMORY_SERVICE_URL:http://localhost:8700}
    enabled: ${MEMORY_SERVICE_ENABLED:true}
  runtime:
    max-active-runs: ${COPILOT_MAX_ACTIVE_RUNS:100}
    max-queued-runs: ${COPILOT_MAX_QUEUED_RUNS:1000}
    max-active-runs-per-user: ${COPILOT_MAX_ACTIVE_RUNS_PER_USER:2}
    max-agents-per-run: ${COPILOT_MAX_AGENTS_PER_RUN:3}
    max-agent-concurrency: ${COPILOT_MAX_AGENT_CONCURRENCY:32}
    max-rag-concurrency: ${COPILOT_MAX_RAG_CONCURRENCY:32}
    queue-timeout: ${COPILOT_QUEUE_TIMEOUT:5m}
    max-llm-concurrency: ${COPILOT_MAX_LLM_CONCURRENCY:16}
    llm-call-timeout: ${COPILOT_LLM_CALL_TIMEOUT:120s}
  mcp:
    enabled: ${COPILOT_MCP_ENABLED:true}
    base-url: ${COPILOT_MCP_BASE_URL:http://127.0.0.1:8085}
    timeout-seconds: ${COPILOT_MCP_TIMEOUT_SECONDS:15}
  gateway:
    langfuse:
      enabled: ${LANGFUSE_ENABLED:true}
      host: ${LANGFUSE_HOST:https://cloud.langfuse.com}
      public-key: ${LANGFUSE_PUBLIC_KEY:}
      secret-key: ${LANGFUSE_SECRET_KEY:}
      environment: ${LANGFUSE_ENV:development}
      timeout-seconds: ${LANGFUSE_TIMEOUT_SECONDS:5}
  agent-roles:
    fund-analyzer:
      - fund_metrics
      - fund_holdings
      - fund_report
    fund-screener:
      - screen_funds
      - schema_rag
    fund-comparator:
      - compare_metrics
      - compare_holdings
      - compare_reports
      - shared_holdings
    stock-analyzer:
      - stock_metrics
    stock-screener:
      - screen_stocks
    stock-comparator:
      - compare_stock_metrics
    report-synthesizer:
      - read_research_artifacts
    reviewer:
      - read_research_artifacts


logging:
  level:
    com.financial.copilot: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}

