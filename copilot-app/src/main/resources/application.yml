server:
  port: 8080

spring:
  application:
    name: financial-copilot
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:financial_copilot}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.financial.copilot.data.*.po
  type-handlers-package: com.financial.copilot.data.config
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 金融智能投研核心配置 (copilot)
copilot:
  redis:
    enabled: ${REDIS_ENABLED:true}
  conversation:
    persistence-enabled: ${CONVERSATION_PERSISTENCE_ENABLED:true}
  alipay:
    enabled: ${ALIPAY_ENABLED:false}
    sandbox: ${ALIPAY_SANDBOX:true}
    app-id: ${ALIPAY_APP_ID:}
    seller-id: ${ALIPAY_SELLER_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    public-key: ${ALIPAY_PUBLIC_KEY:}
    notify-url: ${ALIPAY_NOTIFY_URL:}
  jwt:
    secret: ${JWT_SECRET:FinancialCopilotSecretKeyForJwtAuthentication2026SecureKeyWithAtLeast256BitsLong!}
    access-token-expiration-ms: 7200000
    refresh-token-expiration-ms: 604800000
  llm:
    default-provider: DEEPSEEK
    default-model: ${LLM_MODEL:deepseek-chat}
    default-performance-level: MIDDLE
    api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}

logging:
  level:
    com.financial.copilot: INFO
