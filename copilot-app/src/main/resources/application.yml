server:
  port: 8080

spring:
  application:
    name: financial-copilot
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:financial_copilot}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.financial.copilot.data.*.po
  type-handlers-package: com.financial.copilot.data.config
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 金融智能投研核心配置 (copilot)
copilot:
  redis:
    enabled: ${REDIS_ENABLED:true}
  conversation:
    persistence-enabled: ${CONVERSATION_PERSISTENCE_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:FinancialCopilotSecretKeyForJwtAuthentication2026SecureKeyWithAtLeast256BitsLong!}
    access-token-expiration-ms: 7200000
    refresh-token-expiration-ms: 604800000
  llm:
    default-provider: DEEPSEEK
    default-model: ${LLM_MODEL:deepseek-chat}
    default-performance-level: MIDDLE
    api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}

# 外部投研工具与 MCP 网关配置
financial:
  copilot:
    tools:
      component-invoke-service-url: ${WIND_FUNDRESEARCH_SERVICE_URL:https://exp.wind.com.cn/FundStaticWeb}
      infra-web:
        service-url: ${WIND_FUNDINFRAWEB_SERVICE_URL:https://exp.wind.com.cn/FundInfraWeb/invoke}
        timeout-seconds: ${WIND_FUNDINFRAWEB_TIMEOUT_SECONDS:60}
        verify-tls: ${WIND_FUNDINFRAWEB_VERIFY_TLS:false}
      mcp:
        base-url: ${WIND_MCP_BASE_URL:https://114.80.154.45/Wind.MCP.Server/vserver}
        timeout-seconds: ${WIND_MCP_TIMEOUT_SECONDS:60}
        verify-tls: ${WIND_MCP_VERIFY_TLS:false}
        servers:
          wind-fund-data: ${WIND_MCP_WIND_FUND_DATA_URL:https://114.80.154.45/Wind.MCP.Server/vserver/vserver_fund_datatest/mcp}
          wind-fund-holdings: ${WIND_MCP_WIND_FUND_HOLDINGS_URL:https://114.80.154.45/Wind.MCP.Server/vserver/vserver_fund_holdtest/mcp}
          wind-fund-analysis: ${WIND_MCP_WIND_FUND_ANALYSIS_URL:https://114.80.154.45/Wind.MCP.Server/vserver/vserver_fund_analysistest/mcp}
      aimarket:
        service-url: ${WIND_AIMARKET_SERVICE_URL:https://exp.wind.com.cn/aimarket/mcp}
        timeout-seconds: ${WIND_AIMARKET_TIMEOUT_SECONDS:60}
        verify-tls: ${WIND_AIMARKET_VERIFY_TLS:true}

logging:
  level:
    com.financial.copilot: INFO

