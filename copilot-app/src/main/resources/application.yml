server:
  port: 8080

spring:
  application:
    name: financial-copilot
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:financial_copilot}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.financial.copilot.data.fund.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# DeepSeek 大模型配置 (默认从环境变量读取，若无则使用安全占位符走规则引擎)
deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  model-name: ${DEEPSEEK_MODEL:deepseek-chat}
  temperature: 0.2

logging:
  level:
    com.financial.copilot: INFO
