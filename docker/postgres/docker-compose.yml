version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docker_postgres_16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: financial_copilot
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    restart: always
    networks:
      - myservice_network

  neo4j:
    image: neo4j:5.20-community
    container_name: docker_neo4j_5
    environment:
      NEO4J_AUTH: neo4j/financial_copilot
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_db_memory_heap_max__size: 1G
      TZ: Asia/Shanghai
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./data/neo4j:/data
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/plugins:/var/lib/neo4j/plugins
    restart: always
    networks:
      - myservice_network

networks:
  myservice_network:
    external: true
