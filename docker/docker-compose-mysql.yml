version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: financial_copilot_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "financial_copilot"
    volumes:
      - ../copilot-app/src/main/resources/db/schema-mysql.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 10
