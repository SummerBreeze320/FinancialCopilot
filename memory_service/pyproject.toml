[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-service"
version = "0.1.0"
description = "Financial Copilot Long-Term Memory Service (Memory Engine + Store + Reader)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncmy>=0.2.9",
    "aiosqlite>=0.20.0",
    "pymilvus>=2.4.0",
    "tiktoken>=0.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "mem0ai>=2.1.0",
    "reme-ai>=0.4.1",
    "agentscope>=2.0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", ".."]
