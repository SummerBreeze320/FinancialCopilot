[project]
name = "financial-knowledge-rag"
version = "0.1.0"
description = "Financial Knowledge RAG Service with Table-Aware Chunking, GPU OCR, and Neural Reranking"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "pandas>=2.2.0",
    "sentence-transformers>=3.0.0",
    "rapidocr-onnxruntime>=1.3.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
