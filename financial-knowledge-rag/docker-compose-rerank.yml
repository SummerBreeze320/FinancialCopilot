version: '3.8'

services:
  # 方案一：Hugging Face 官方高性能 Text Embeddings Inference (TEI) 容器 (推荐用于生产)
  rerank-tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: financial-reranker-tei
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      - MODEL_ID=BAAI/bge-reranker-large
      - PORT=80
    volumes:
      - ./data/models/reranker:/data
    # 若主机具备 NVIDIA GPU，可切换为 GPU 镜像并放开 deploy 配置：
    # image: ghcr.io/huggingface/text-embeddings-inference:1.5
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # 方案二：基于 Python 编写的轻量独立 FastAPI 重排微服务容器 (开发与离线调试)
  rerank-python:
    build:
      context: .
      dockerfile: docker/Dockerfile.rerank
    container_name: financial-reranker-py
    restart: unless-stopped
    ports:
      - "8089:8088"
    environment:
      - RERANK_MODEL=BAAI/bge-reranker-large
      - RERANK_DEVICE=cpu
    volumes:
      - ./data/models/reranker:/root/.cache/huggingface
